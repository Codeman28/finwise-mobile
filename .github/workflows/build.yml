# build.yml - FinWise Mobile CI/CD
# ---------------------------------------------------------------------------
# Every push / pull request to main:
#   1. test      analyze + run all unit and widget tests
#   2. android   build the release APKs (one for all phones + small per-CPU ones)
#   3. web       build the web version and publish it to GitHub Pages
# Every tag like v1.0.0:
#   4. release   create a GitHub Release with the APKs attached
# ---------------------------------------------------------------------------
name: Build FinWise Mobile

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button

permissions:
  contents: write # needed to create releases
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The release (upload) key lives in repository secrets, never in the code.
      # Pull requests from forks have no access to secrets -> debug-signed build.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets - building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing key restored."
      - name: Build APK for all phones
        run: flutter build apk --release
      - name: Build small per-CPU APKs
        run: flutter build apk --release --split-per-abi
      - name: Build App Bundle for Google Play
        run: flutter build appbundle --release
      - name: Collect files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FinWise.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/FinWise-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/FinWise-armv7.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/FinWise-GooglePlay.aab
      - name: Remove signing files from the runner
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: finwise-android
          path: dist/*

  web:
    needs: test
    # Only from the main branch: GitHub Pages refuses deployments from tags.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # GitHub Pages serves the site from /<repo-name>/, so the app needs that base path.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finwise-android
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## FinWise ${{ github.ref_name }}

            **Cài trên Android:** tải `FinWise-arm64.apk` (hầu hết điện thoại) hoặc `FinWise.apk` (mọi máy),
            mở file trên điện thoại và cho phép "Cài đặt từ nguồn không xác định".

            **Google Play:** `FinWise-GooglePlay.aab` là gói để tải lên Google Play Console.

            **Chạy thử trên trình duyệt:** https://codeman28.github.io/finwise-mobile/
